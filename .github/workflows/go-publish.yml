name: "FFI - Go Bindings"

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to create for release (e.g. v0.17.0)"
        required: true
      cdk_version:
        description: 'CDK dependency version (e.g. 0.17.0). Defaults to release_tag without the "v" prefix.'
        required: false
      cdk_ref:
        description: "CDK git ref to publish from. Must match release_tag unless this is a nightly."
        required: false
      prerelease:
        description: 'Mark the GitHub release as a pre-release'
        type: boolean
        default: false
      nightly:
        description: "Build an immutable nightly prerelease from an exact CDK commit."
        type: boolean
        default: false
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true
      cdk_version:
        type: string
        required: false
      cdk_ref:
        type: string
        required: false
      prerelease:
        type: boolean
        required: false
        default: false
      nightly:
        type: boolean
        required: false
        default: false
env:
  CARGO_TERM_COLOR: ${{ vars.CARGO_TERM_COLOR }}
  TAG: ${{ inputs.release_tag }}
  CDK_REF: ${{ inputs.cdk_ref || inputs.release_tag }}
  CDK_CHECKOUT_REF: ${{ inputs.nightly && inputs.cdk_ref || format('refs/tags/{0}', inputs.release_tag) }}
  CDK_SOURCE_TAG: ${{ inputs.cdk_version && format('refs/tags/v{0}', inputs.cdk_version) || format('refs/tags/{0}', inputs.release_tag) }}
  CDK_SOURCE_MANIFEST: ${{ inputs.nightly && 'Cargo.toml' || 'cdk-src/Cargo.toml' }}
  RELEASE_BRANCH: release/${{ inputs.release_tag }}
  # Tag v0.6.0+v0.30.0. Pinned by commit because a tag can be repointed
  # upstream, and --locked only pins the tool's own dependencies.
  UNIFFI_BINDGEN_GO_REV: 5ad642822ad3c52219bd7081c0e58c2ac22bd9f8

jobs:
  validate-release-ref:
    name: "go: Validate release ref"
    runs-on: ubuntu-latest
    steps:
      - name: Validate release ref
        shell: bash
        run: |
          if [[ "${{ inputs.nightly }}" == "true" ]]; then
            if [[ "${{ inputs.prerelease }}" != "true" ]]; then
              echo "::error::Nightly releases must be marked as prereleases"
              exit 1
            fi

            if [[ ! "${CDK_REF}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Nightly cdk_ref must be an exact 40-character commit SHA; got ${CDK_REF}"
              exit 1
            fi

            if [[ ! "${TAG}" =~ ^v[0-9]+[.][0-9]+[.][0-9]+-nightly[.][0-9]{8}[.]g[0-9a-f]{7}$ ]]; then
              echo "::error::Nightly release_tag must look like v0.18.0-nightly.20260801.g1a2b3c4; got ${TAG}"
              exit 1
            fi
          elif [[ "${CDK_REF}" != "${TAG}" ]]; then
            echo "::error::cdk_ref must match release_tag (${TAG}); got ${CDK_REF}"
            exit 1
          fi

          if [[ ! "${TAG}" =~ ^v[0-9]+[.][0-9]+[.][0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release_tag must be a version tag such as v0.17.0; got ${TAG}"
            exit 1
          fi

      - name: Verify the cdk-ffi source tag exists
        if: ${{ !inputs.nightly }}
        run: |
          git ls-remote --exit-code --tags \
            "https://github.com/${GITHUB_REPOSITORY}.git" "${CDK_SOURCE_TAG}" >/dev/null \
            || { echo "::error::${CDK_SOURCE_TAG} does not exist; cdk_version must name a released CDK tag"; exit 1; }

      - name: Verify release source exists
        uses: actions/checkout@v5
        with:
          ref: ${{ env.CDK_CHECKOUT_REF }}
          fetch-depth: 1
          persist-credentials: false

  go-sync-sources:
    name: "go: Sync sources to cdk-go"
    needs: [validate-release-ref]
    runs-on: ubuntu-latest
    steps:
      - name: Resolve variables
        run: |
          CDK_VER="${{ inputs.cdk_version }}"
          echo "CDK_VER=${CDK_VER:-${TAG#v}}" >> "$GITHUB_ENV"
          echo "RELEASE_VER=${TAG#v}" >> "$GITHUB_ENV"

      - name: Checkout monorepo
        uses: actions/checkout@v5
        with:
          ref: ${{ env.CDK_CHECKOUT_REF }}

      # cdk-ffi is pinned to a published version, whose dependency requirements
      # were frozen when it was released. Its own tag, not the release tag, is
      # what the binding lockfile has to be seeded from.
      - name: Checkout the cdk-ffi source tag
        if: ${{ !inputs.nightly }}
        uses: actions/checkout@v5
        with:
          ref: ${{ env.CDK_SOURCE_TAG }}
          path: cdk-src
          fetch-depth: 1
          persist-credentials: false

      - name: Verify the cdk-ffi source tag
        if: ${{ !inputs.nightly }}
        run: |
          REF_VER=$(sed -n '/^\[workspace\.package\]/,/^\[/p' cdk-src/Cargo.toml \
            | grep '^version ' | head -1 | cut -d'"' -f2)
          if [[ "${REF_VER}" != "${CDK_VER}" ]]; then
            echo "::error::${CDK_SOURCE_TAG} declares workspace version ${REF_VER}, not ${CDK_VER}"
            exit 1
          fi
          echo "Seeding the binding lockfile from ${CDK_SOURCE_TAG}"

      - name: Clone cdk-go
        run: |
          git clone https://x-access-token:${{ secrets.FFI_DEPLOY_KEY }}@github.com/${{ vars.CDK_GO_REPO }}.git cdk-go

      - name: Copy bindings/go to cdk-go
        run: |
          rsync -av \
            --exclude='.github' \
            --exclude='target' \
            --exclude='.git' \
            bindings/go/ cdk-go/
          cp rust-toolchain.toml cdk-go/

      - name: Update versions and resolve workspace references
        run: |
          echo "Setting CDK version to ${CDK_VER}, release version to ${RELEASE_VER}"

          # Helper: extract a value from [workspace.package] in root Cargo.toml
          ws_pkg() {
            sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml \
              | grep "^$1 " | head -1 | sed 's/.*= *"\(.*\)"/\1/'
          }

          # Helper: extract a workspace dependency version
          ws_dep_ver() {
            local line
            line=$(sed -n '/^\[workspace\.dependencies\]/,/^\[/p' Cargo.toml \
              | grep "^$1 " | head -1)
            # Handle both: dep = "version" and dep = { ..., version = "x", ... }
            if echo "$line" | grep -q 'version *= *"'; then
              echo "$line" | sed 's/.*version *= *"\([^"]*\)".*/\1/'
            else
              echo "$line" | sed 's/.*= *"\([^"]*\)".*/\1/'
            fi
          }

          # Read workspace values dynamically
          WS_EDITION=$(ws_pkg edition)
          WS_RUST_VERSION=$(ws_pkg rust-version)
          WS_LICENSE=$(ws_pkg license)
          WS_HOMEPAGE=$(ws_pkg homepage)
          WS_REPOSITORY=$(ws_pkg repository)
          WS_README=$(ws_pkg readme)
          WS_UNIFFI_VER=$(ws_dep_ver uniffi)

          echo "Workspace values: edition=${WS_EDITION} rust-version=${WS_RUST_VERSION} uniffi=${WS_UNIFFI_VER}"

          # Resolve workspace package fields in rust/Cargo.toml
          sed -i \
            -e "s/^edition\.workspace = true/edition = \"${WS_EDITION}\"/" \
            -e "s/^rust-version\.workspace = true/rust-version = \"${WS_RUST_VERSION}\"/" \
            -e "s/^license\.workspace = true/license = \"${WS_LICENSE}\"/" \
            -e "s|^homepage\.workspace = true|homepage = \"${WS_HOMEPAGE}\"|" \
            -e "s|^repository\.workspace = true|repository = \"${WS_REPOSITORY}\"|" \
            -e "s/^version\.workspace = true/version = \"${CDK_VER}\"/" \
            -e "s/^readme\.workspace = true/readme = \"${WS_README}\"/" \
            cdk-go/rust/Cargo.toml

          if [[ "${{ inputs.nightly }}" == "true" ]]; then
            CDK_FFI_SOURCE="git = \"https://github.com/${GITHUB_REPOSITORY}\", rev = \"${CDK_REF}\""
          else
            CDK_FFI_SOURCE="version = \"=${CDK_VER}\""
          fi

          # Resolve workspace dependency references. Nightlies use the exact
          # source commit because that cdk-ffi version is not on crates.io.
          sed -i \
            -e "s|cdk-ffi = { workspace = true|cdk-ffi = { ${CDK_FFI_SOURCE}|" \
            -e "s/uniffi = { workspace = true/uniffi = { version = \"${WS_UNIFFI_VER}\"/" \
            cdk-go/rust/Cargo.toml

          # Remove workspace lints reference
          sed -i '/^\[lints\]/,/^$/s/^workspace = true//' cdk-go/rust/Cargo.toml

          # Detach from the monorepo workspace: the release job clones
          # cdk-go inside the checkout, so cargo would otherwise walk up
          # to the root Cargo.toml and reject a non-member package.
          printf '\n[workspace]\n' >> cdk-go/rust/Cargo.toml

          # Add release profile
          printf '\n[profile.release]\nlto = true\nstrip = true\ncodegen-units = 1\n' >> cdk-go/rust/Cargo.toml

          echo "--- rust/Cargo.toml ---"
          cat cdk-go/rust/Cargo.toml

      - name: Seed Cargo.lock from the cdk-ffi source lockfile
        run: ./.github/scripts/seed-binding-lockfile.sh cdk-go/rust "${CDK_SOURCE_MANIFEST}"

      - name: Push to cdk-go release branch
        working-directory: cdk-go
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git show-ref --verify --quiet "refs/remotes/origin/${RELEASE_BRANCH}"; then
            git checkout -B "${RELEASE_BRANCH}" "origin/${RELEASE_BRANCH}"
          else
            git checkout -b "${RELEASE_BRANCH}"
          fi
          git add -A
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "sync: update sources for ${TAG}"
          git push origin "${RELEASE_BRANCH}"

  go-build-native:
    name: "go: Build ${{ matrix.target }}"
    needs: [go-sync-sources]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            artifact: libcdk_ffi_go.so
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            artifact: libcdk_ffi_go.so

          # macOS
          - target: aarch64-apple-darwin
            runner: macos-14
            artifact: libcdk_ffi_go.dylib
          - target: x86_64-apple-darwin
            runner: macos-14
            artifact: libcdk_ffi_go.dylib

          # Windows
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            artifact: cdk_ffi_go.dll

    steps:
      - name: Clone cdk-go
        shell: bash
        run: |
          git clone --branch "${RELEASE_BRANCH}" \
            https://x-access-token:${{ secrets.FFI_DEPLOY_KEY }}@github.com/${{ vars.CDK_GO_REPO }}.git cdk-go

      - name: Install pinned Rust toolchain
        working-directory: cdk-go
        shell: bash
        run: |
          # rust-toolchain.toml is the single source of truth here; rustup
          # installs it on demand. Never resolve to floating stable.
          rustup show active-toolchain
          rustup target add ${{ matrix.target }}
          CHANNEL=$(grep '^channel' rust-toolchain.toml | cut -d'"' -f2)
          # Captured rather than piped into grep -q: a short-circuiting grep
          # kills rustc with SIGPIPE, which pipefail reports as a failure even
          # when the version matched.
          RUSTC_VV=$(rustc -vV)
          echo "${RUSTC_VV}"
          RUSTC_RELEASE=$(awk '/^release:/ { print $2 }' <<< "${RUSTC_VV}")
          if [[ "${RUSTC_RELEASE}" != "${CHANNEL}" ]]; then
            echo "::error::expected rustc ${CHANNEL} per rust-toolchain.toml; got ${RUSTC_RELEASE}"
            exit 1
          fi

      - name: Build cdk-ffi-go
        working-directory: cdk-go/rust
        shell: bash
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Fix dylib install name
        if: endsWith(matrix.artifact, '.dylib')
        working-directory: cdk-go/rust
        run: |
          install_name_tool -id @rpath/libcdk_ffi_go.dylib \
            target/${{ matrix.target }}/release/${{ matrix.artifact }}

      - name: Install uniffi-bindgen-go
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        working-directory: cdk-go
        run: |
          cargo install uniffi-bindgen-go \
            --git https://github.com/NordSecurity/uniffi-bindgen-go \
            --rev ${{ env.UNIFFI_BINDGEN_GO_REV }} \
            --locked --force

      - name: Generate Go bindings
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        working-directory: cdk-go/rust
        run: |
          mkdir -p ../../generated-bindings
          uniffi-bindgen-go \
            "target/${{ matrix.target }}/release/${{ matrix.artifact }}" \
            --library \
            --config ../uniffi.toml \
            --out-dir ../../generated-bindings

      - name: Upload generated bindings
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v7
        with:
          name: go-bindings-generated
          path: generated-bindings/

      - name: Strip debug symbols
        working-directory: cdk-go/rust
        shell: bash
        run: |
          FILE="target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          case "${{ matrix.target }}" in
            *windows*)  strip --strip-all "$FILE" ;;
            *apple*)    strip -S "$FILE" ;;
            *)          strip --strip-all "$FILE" ;;
          esac

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "cdk-go/rust/target/${{ matrix.target }}/release/${{ matrix.artifact }}" \
             "dist/${{ matrix.target }}-${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: go-native-${{ matrix.target }}
          path: dist/

  go-publish:
    name: "go: Publish to cdk-go"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    needs: [go-build-native]
    steps:
      - name: Clone cdk-go
        run: |
          git clone --branch "${RELEASE_BRANCH}" \
            https://x-access-token:${{ secrets.FFI_DEPLOY_KEY }}@github.com/${{ vars.CDK_GO_REPO }}.git cdk-go

      - name: Checkout monorepo (for the build manifest)
        uses: actions/checkout@v5
        with:
          path: cdk
          ref: ${{ env.CDK_CHECKOUT_REF }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download all native artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          pattern: go-native-*
          merge-multiple: true

      - name: Download generated Go bindings
        uses: actions/download-artifact@v8
        with:
          name: go-bindings-generated
          path: ./generated-bindings

      - name: Organize native libraries
        run: |
          NATIVE_DIR="cdk-go/bindings/cdkffi/native"

          # Regenerated wholesale: the sync rsync does not --delete, so a
          # library renamed between releases would otherwise linger here and
          # land in checksums.sha256.
          rm -rf "${NATIVE_DIR}"

          declare -A TARGET_MAP
          TARGET_MAP[x86_64-unknown-linux-gnu]="linux_amd64"
          TARGET_MAP[aarch64-unknown-linux-gnu]="linux_arm64"
          TARGET_MAP[aarch64-apple-darwin]="darwin_arm64"
          TARGET_MAP[x86_64-apple-darwin]="darwin_amd64"
          TARGET_MAP[x86_64-pc-windows-msvc]="windows_amd64"

          declare -A ARTIFACT_MAP
          ARTIFACT_MAP[x86_64-unknown-linux-gnu]="libcdk_ffi_go.so"
          ARTIFACT_MAP[aarch64-unknown-linux-gnu]="libcdk_ffi_go.so"
          ARTIFACT_MAP[aarch64-apple-darwin]="libcdk_ffi_go.dylib"
          ARTIFACT_MAP[x86_64-apple-darwin]="libcdk_ffi_go.dylib"
          ARTIFACT_MAP[x86_64-pc-windows-msvc]="cdk_ffi_go.dll"

          for target in "${!TARGET_MAP[@]}"; do
            go_dir="${TARGET_MAP[$target]}"
            artifact="${ARTIFACT_MAP[$target]}"
            mkdir -p "${NATIVE_DIR}/${go_dir}"
            cp "artifacts/${target}-${artifact}" "${NATIVE_DIR}/${go_dir}/${artifact}"
          done

          echo "Native libraries organized:"
          find "${NATIVE_DIR}" -type f

      - name: Generate go.mod
        working-directory: cdk-go
        run: |
          MAJOR_VER="${TAG#v}"
          MAJOR_VER="${MAJOR_VER%%.*}"
          MODULE="github.com/${{ vars.CDK_GO_REPO }}"
          if [ "$MAJOR_VER" -ge 2 ] 2>/dev/null; then
            MODULE="${MODULE}/v${MAJOR_VER}"
          fi
          if [ ! -f go.mod ]; then
            go mod init "${MODULE}"
          else
            go mod edit -module "${MODULE}"
          fi
          go mod edit -go 1.22

      - name: Copy generated Go bindings
        run: |
          PACKAGE_DIR="cdk-go/bindings/cdkffi"
          cp generated-bindings/cdkffi/cdk_ffi.go "${PACKAGE_DIR}/cdk_ffi.go"
          cp generated-bindings/cdkffi/cdk_ffi.h "${PACKAGE_DIR}/cdk_ffi.h"

      - name: Generate link files
        run: |
          PACKAGE_DIR="cdk-go/bindings/cdkffi"

          cat > "${PACKAGE_DIR}/link_linux_amd64.go" <<'EOF'
          //go:build linux && amd64

          package cdk_ffi

          // #cgo LDFLAGS: -L${SRCDIR}/native/linux_amd64 -lcdk_ffi_go -Wl,-rpath,${SRCDIR}/native/linux_amd64 -lm -ldl
          import "C"
          EOF

          cat > "${PACKAGE_DIR}/link_linux_arm64.go" <<'EOF'
          //go:build linux && arm64

          package cdk_ffi

          // #cgo LDFLAGS: -L${SRCDIR}/native/linux_arm64 -lcdk_ffi_go -Wl,-rpath,${SRCDIR}/native/linux_arm64 -lm -ldl
          import "C"
          EOF

          cat > "${PACKAGE_DIR}/link_darwin_amd64.go" <<'EOF'
          //go:build darwin && amd64

          package cdk_ffi

          // #cgo LDFLAGS: -L${SRCDIR}/native/darwin_amd64 -lcdk_ffi_go -Wl,-rpath,${SRCDIR}/native/darwin_amd64 -lm
          import "C"
          EOF

          cat > "${PACKAGE_DIR}/link_darwin_arm64.go" <<'EOF'
          //go:build darwin && arm64

          package cdk_ffi

          // #cgo LDFLAGS: -L${SRCDIR}/native/darwin_arm64 -lcdk_ffi_go -Wl,-rpath,${SRCDIR}/native/darwin_arm64 -lm
          import "C"
          EOF

          cat > "${PACKAGE_DIR}/link_windows_amd64.go" <<'EOF'
          //go:build windows && amd64

          package cdk_ffi

          // #cgo LDFLAGS: -L${SRCDIR}/native/windows_amd64 -lcdk_ffi_go
          import "C"
          EOF

      - name: Update checksums
        run: |
          NATIVE_DIR="cdk-go/bindings/cdkffi/native"
          CHECKSUM_FILE="${NATIVE_DIR}/checksums.sha256"
          LIBS=()
          while IFS= read -r -d '' f; do
            LIBS+=("${f}")
          done < <(find "${NATIVE_DIR}" -type f \( -name "*.so" -o -name "*.dylib" -o -name "*.dll" \) -print0 | sort -z)
          {
            for abs_path in "${LIBS[@]}"; do
              rel_path="${abs_path#"${NATIVE_DIR}/"}"
              hash="$(sha256sum "${abs_path}" | awk '{print $1}')"
              echo "${hash}  ${rel_path}"
            done
          } > "${CHECKSUM_FILE}"
          echo "Updated ${CHECKSUM_FILE}:"
          cat "${CHECKSUM_FILE}"

      - name: Write build manifest
        working-directory: cdk
        env:
          CDK_VER: ${{ inputs.cdk_version }}
          NIGHTLY: ${{ inputs.nightly }}
        run: |
          ./.github/scripts/write-build-manifest.sh go \
            ../cdk-go ../cdk-go/build-manifest.json

      - name: Commit to release branch
        working-directory: cdk-go
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "release: ${TAG} — add bindings and native libraries"

      - name: Push release branch
        working-directory: cdk-go
        run: git push origin "${RELEASE_BRANCH}"

      - name: Build release archive
        run: |
          tar -czf "cdk-go-bindings-${TAG}.tar.gz" -C cdk-go bindings/cdkffi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            cdk-go-bindings-${{ inputs.release_tag }}.tar.gz

      - name: Create release on cdk-go (creates tag and uploads asset atomically)
        working-directory: cdk-go
        env:
          GH_TOKEN: ${{ secrets.FFI_DEPLOY_KEY }}
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          RELEASE_OPTIONS=(--generate-notes)
          if [[ "${{ inputs.nightly }}" == "true" ]]; then
            RELEASE_OPTIONS+=(
              --prerelease
              --latest=false
              --notes "Nightly bindings built from CDK commit ${CDK_REF}: https://github.com/${GITHUB_REPOSITORY}/commit/${CDK_REF}"
            )
          elif [[ "${{ inputs.prerelease }}" == "true" ]]; then
            RELEASE_OPTIONS+=(--prerelease)
          fi

          gh release create "${TAG}" \
            --repo ${{ vars.CDK_GO_REPO }} \
            --target "${COMMIT_SHA}" \
            --title "Release ${TAG}" \
            "${RELEASE_OPTIONS[@]}" \
            "../cdk-go-bindings-${TAG}.tar.gz" \
            build-manifest.json

      - name: Merge to default branch
        if: ${{ !inputs.nightly }}
        working-directory: cdk-go
        run: |
          DEFAULT_BRANCH=$(git symbolic-ref refs/remotes/origin/HEAD | sed 's@^refs/remotes/origin/@@')
          echo "DEFAULT_BRANCH=${DEFAULT_BRANCH}" >> "$GITHUB_ENV"
          git checkout "${DEFAULT_BRANCH}"
          git merge "${RELEASE_BRANCH}" --squash
          git commit -m "release: ${TAG}"
          git push origin "${DEFAULT_BRANCH}"

      - name: Clean up release branch
        working-directory: cdk-go
        run: git push origin --delete "${RELEASE_BRANCH}"
