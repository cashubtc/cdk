name: Publish Reproducible Binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (v<workspace version>)"
        required: true
      check_reproducibility:
        description: "Rebuild and compare only (do not publish release assets)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: release-binaries-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          fetch-depth: 0
      - id: source
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, tomllib
          with open('Cargo.toml', 'rb') as stream:
              version = tomllib.load(stream)['workspace']['package']['version']
          tag = os.environ['TAG']
          if tag != 'v' + version or not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?', tag):
              raise SystemExit('Expected v<workspace version> release tag')
          commit = subprocess.check_output(['git', 'rev-parse', f'refs/tags/{tag}^{{commit}}'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f'commit={commit}\ntag={tag}\n')
          PY

  release-ci:
    needs: resolve
    uses: ./.github/workflows/release-ci.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}

  build:
    needs: [resolve, release-ci]
    name: Build (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: self-hosted
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
      - name: Install Nix
        if: matrix.system != 'x86_64-linux'
        uses: DeterminateSystems/nix-installer-action@v22
      - name: Build and smoke test (optionally compare a rebuild)
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          CHECK_REPRODUCIBILITY: ${{ inputs.check_reproducibility || false }}
        run: |
          args=()
          if [ "$CHECK_REPRODUCIBILITY" = true ]; then
            args+=(--check-reproducibility)
          fi
          ./scripts/release-binaries build --tag "$TAG" "${args[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.system }}
          path: ./static-bin/
          if-no-files-found: error

  upload-release:
    name: Publish binaries
    if: ${{ !inputs.check_reproducibility }}
    runs-on: ubuntu-latest
    needs: [resolve, build]
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: ./static-bin/
          merge-multiple: true
      - name: Validate the full matrix and publish without replacing assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          ./scripts/release-binaries assemble --tag "$TAG"
          ./scripts/release-binaries publish --tag "$TAG" --repo "$REPO"
