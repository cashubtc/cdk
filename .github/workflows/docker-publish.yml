name: Publish Docker Images

# Images are built from the static binaries attached to the GitHub release
# rather than compiled again, so each image ships the exact binary listed in
# the release's SHA256SUMS.
on:
  workflow_run:
    workflows: ["Publish Static Binaries"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (its static binaries must already be attached)'
        required: true
      floating_tags:
        description: 'Also update the major.minor and latest tags when the release qualifies'
        type: boolean
        default: false

env:
  REGISTRY: docker.io
  IMAGE_NAME: cashubtc/mintd

permissions:
  contents: read
  actions: read

jobs:
  resolve:
    # Only follow successful runs started by a published release. A static
    # build that was dispatched by hand needs a manual run of this workflow.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'release' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      major_minor: ${{ steps.tag.outputs.major_minor }}
      is_stable: ${{ steps.tag.outputs.is_stable }}
      is_latest: ${{ steps.tag.outputs.is_latest }}
    steps:
      - name: Determine tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
          FLOATING_INPUT: ${{ inputs.floating_tags }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            TAG="$RUN_TAG"
            FLOATING=true
          else
            TAG="${INPUT_TAG#refs/tags/}"
            FLOATING="$FLOATING_INPUT"
          fi

          if ! PRERELEASE=$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease); then
            echo "::error::No GitHub release found for tag '${TAG}'"
            exit 1
          fi

          VERSION="${TAG#v}"
          MAJOR="${VERSION%%.*}"
          MINOR="${VERSION#*.}"
          MINOR="${MINOR%%.*}"

          IS_STABLE=false
          IS_LATEST=false
          if [[ "$FLOATING" == "true" && "$PRERELEASE" == "false" && "$TAG" != *rc* ]]; then
            IS_STABLE=true
            # A patch on an older line must not move :latest backwards, so
            # follow GitHub's own latest-release marker (highest semver).
            LATEST_TAG=$(gh api "repos/${GH_REPO}/releases/latest" --jq .tag_name)
            if [[ "$TAG" == "$LATEST_TAG" ]]; then
              IS_LATEST=true
            fi
          fi

          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "major_minor=${MAJOR}.${MINOR}"
            echo "is_stable=${IS_STABLE}"
            echo "is_latest=${IS_LATEST}"
          } >> "$GITHUB_OUTPUT"

  release-ci:
    needs: resolve
    uses: ./.github/workflows/release-ci.yml
    with:
      ref: ${{ needs.resolve.outputs.tag }}

  build:
    needs: [resolve, release-ci]
    strategy:
      fail-fast: false
      matrix:
        arch:
          - name: x86_64
            runner: ubuntu-24.04
            docker_platform: linux/amd64
            docker_arch: amd64
          - name: aarch64
            runner: ubuntu-24.04-arm
            docker_platform: linux/arm64
            docker_arch: arm64
        variant:
          - name: standard
            binary: cdk-mintd
            tag_suffix: ""
          - name: ldk-node
            binary: cdk-mintd-ldk
            tag_suffix: "-ldk-node"
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Download and verify release binary
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          ASSET: ${{ matrix.variant.binary }}-${{ needs.resolve.outputs.version }}-${{ matrix.arch.name }}
        run: |
          mkdir -p ./release-assets ./docker-build
          gh release download "$TAG" --dir ./release-assets \
            --pattern "$ASSET" --pattern SHA256SUMS

          cd ./release-assets
          awk -v f="$ASSET" '$2 == f' SHA256SUMS > expected.sha256
          if [[ ! -s expected.sha256 ]]; then
            echo "::error::${ASSET} is not listed in SHA256SUMS for ${TAG}"
            exit 1
          fi
          sha256sum --check --strict expected.sha256
          cd ..

          install -m 0755 "./release-assets/${ASSET}" ./docker-build/cdk-mintd
          cp Dockerfile.static ./docker-build/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./docker-build
          push: true
          pull: true
          platforms: ${{ matrix.arch.docker_platform }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.resolve.outputs.version }}${{ matrix.variant.tag_suffix }}-${{ matrix.arch.docker_arch }}

  manifest:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: standard
            tag_suffix: ""
          - name: ldk-node
            tag_suffix: "-ldk-node"

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create versioned manifest
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          docker buildx imagetools create \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}${{ matrix.variant.tag_suffix }}" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}${{ matrix.variant.tag_suffix }}-amd64" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}${{ matrix.variant.tag_suffix }}-arm64"

      - name: Create major.minor manifest
        if: ${{ needs.resolve.outputs.is_stable == 'true' }}
        env:
          MAJOR_MINOR: ${{ needs.resolve.outputs.major_minor }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          docker buildx imagetools create \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${MAJOR_MINOR}${{ matrix.variant.tag_suffix }}" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}${{ matrix.variant.tag_suffix }}-amd64" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}${{ matrix.variant.tag_suffix }}-arm64"

      - name: Create latest manifest
        if: ${{ needs.resolve.outputs.is_latest == 'true' }}
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          docker buildx imagetools create \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest${{ matrix.variant.tag_suffix }}" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}${{ matrix.variant.tag_suffix }}-amd64" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}${{ matrix.variant.tag_suffix }}-arm64"
