# Before starting, export CDK_MINTD_MNEMONIC with a stable BIP39 mnemonic.
services:
  mint:
    image: cashubtc/mintd:latest
  #  build:
  #   context: .
  #   dockerfile: Dockerfile
    container_name: mint
    ports:
      - "8085:8085"
    environment:
      CDK_MINTD_DATABASE: sqlite
      CDK_MINTD_MNEMONIC: "${CDK_MINTD_MNEMONIC:?Set CDK_MINTD_MNEMONIC to a stable BIP39 mnemonic}"
    volumes:
      - ./misc/docker-configs/tor-fakewallet-sqlite.toml:/etc/cdk-mintd/config.toml:ro
      - ./misc/docker-mintd-entrypoint.sh:/usr/local/bin/docker-mintd-entrypoint.sh:ro
      - mintd_data:/var/lib/cdk-mintd
    command: ["/bin/sh", "/usr/local/bin/docker-mintd-entrypoint.sh"]
    networks:
      - cdk
  tor:
    build: ./tor
    container_name: tor
    restart: unless-stopped
    volumes:
      - ./tor/torrc:/etc/tor/torrc
      - ./tor-data:/var/lib/tor/mint
    depends_on:
      - mint
    networks:
      - cdk
networks:
  cdk:
    driver: bridge
volumes:
  mintd_data:
    driver: local
