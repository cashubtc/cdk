# Docker Compose configuration for CDK Mint with PostgreSQL
# Usage: docker-compose -f docker-compose.postgres.yaml up
# Before a new mint's first start, export CDK_MINTD_INIT_MODE=new and
# CDK_MINTD_MNEMONIC with a stable BIP39 mnemonic. Existing-mint upgrades must
# preserve the database and use CDK_MINTD_INIT_MODE=existing.

services:
  # CDK Mint service with PostgreSQL
  mintd:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mint
    ports:
      - "8085:8085"
    environment:
      CDK_MINTD_DATABASE: postgres
      CDK_MINTD_INIT_MODE: "${CDK_MINTD_INIT_MODE:-}"
      CDK_MINTD_POSTGRES_URL: "${CDK_MINTD_POSTGRES_URL:-postgresql://cdk_user:cdk_password@postgres:5432/cdk_mint}"
      CDK_MINTD_MNEMONIC: "${CDK_MINTD_MNEMONIC:?Set CDK_MINTD_MNEMONIC to a stable BIP39 mnemonic}"
    volumes:
      - ./misc/docker-configs/fakewallet-postgres.toml:/etc/cdk-mintd/config.toml:ro
      - ./misc/docker-mintd-entrypoint.sh:/usr/local/bin/docker-mintd-entrypoint.sh:ro
      - mintd_data:/var/lib/cdk-mintd
    command: ["/bin/sh", "/usr/local/bin/docker-mintd-entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  # PostgreSQL database service
  postgres:
    image: postgres:16-alpine
    container_name: mint_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=cdk_user
      - POSTGRES_PASSWORD=cdk_password
      - POSTGRES_DB=cdk_mint
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdk_user -d cdk_mint"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mintd_data:
    driver: local
  postgres_data:
    driver: local
