[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdk-python"
version = "0.0.0"
description = "Python bindings for the Cashu Development Kit wallet"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE.md", "LICENSE-APACHE", "LICENSE-MIT"]
authors = [{ name = "CDK Contributors" }]
keywords = ["cashu", "ecash", "bitcoin", "lightning", "wallet"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Security :: Cryptography",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://github.com/cashubtc/cdk"
Repository = "https://github.com/cashubtc/cdk-python"
Issues = "https://github.com/cashubtc/cdk/issues"

[tool.setuptools]
package-dir = { "" = "src" }
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cdk = ["*.so", "*.dylib", "*.dll"]
