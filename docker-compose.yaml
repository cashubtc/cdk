# Before starting, export CDK_MINTD_MNEMONIC with a stable BIP39 mnemonic.
services:
  # CDK Mint service

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./misc/provisioning/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--enable-feature=otlp-write-receiver'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - cdk

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3011:3000"
    volumes:
      - ./misc/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./misc/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    environment:
      - GF_DASHBOARDS_JSON_ENABLED=true
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PROVISIONING_PATHS=/etc/grafana/provisioning
    networks:
      - cdk
  mintd:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mint
    ports:
      - "8085:8085"
    environment:
      CDK_MINTD_DATABASE: sqlite
      CDK_MINTD_MNEMONIC: "${CDK_MINTD_MNEMONIC:?Set CDK_MINTD_MNEMONIC to a stable BIP39 mnemonic}"
    volumes:
      - ./misc/docker-configs/fakewallet-sqlite.toml:/etc/cdk-mintd/config.toml:ro
      - ./misc/docker-mintd-entrypoint.sh:/usr/local/bin/docker-mintd-entrypoint.sh:ro
      - mintd_data:/var/lib/cdk-mintd
    command: ["/bin/sh", "/usr/local/bin/docker-mintd-entrypoint.sh"]
    depends_on:
      - prometheus
      - grafana
    networks:
      - cdk
    # Uncomment when using PostgreSQL:
    # depends_on:
    #   - postgres


