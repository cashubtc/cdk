[package]
name = "cdk-common"
version.workspace = true
authors = ["CDK Developers"]
description = "CDK common types and traits"
homepage = "https://github.com/cashubtc/cdk"
repository = "https://github.com/cashubtc/cdk.git"
edition.workspace = true
rust-version.workspace = true # MSRV
license.workspace = true
readme = "README.md"

[features]
default = ["mint", "wallet"]
test = []
bench = []
wallet = ["cashu/wallet", "dep:uuid"]
mint = ["cashu/mint", "dep:uuid"]
nostr = ["wallet", "cashu/nostr"]
prometheus = ["cdk-prometheus/default"]
# `http` selects the default `bitreq` backend so any crate enabling HTTP support
# gets a working client. Add `cdk-http-client/reqwest` to override (it takes
# precedence; the backends are additive).
http = ["dep:cdk-http-client", "cdk-http-client/bitreq", "dep:jsonwebtoken"]
grpc = ["dep:tonic"]
# Keep cdk-common's bip353 in lockstep with the http client's, so the
# `Transport::resolve_dns_txt` gate (and the rate limiter's decorator of it)
# lines up whenever the HTTP backend is present.
bip353 = ["cdk-http-client?/bip353"]

[dependencies]
async-trait.workspace = true
bitcoin.workspace = true
cashu.workspace = true
serde.workspace = true
lightning-invoice.workspace = true
lightning.workspace = true
thiserror.workspace = true
tracing.workspace = true
cdk-prometheus = { workspace = true, optional = true}
url.workspace = true
uuid = { workspace = true, optional = true }
futures.workspace = true
anyhow.workspace = true
serde_json.workspace = true
web-time.workspace = true
parking_lot = "0.12.5"
jsonwebtoken = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
cdk-http-client = { workspace = true, default-features = false, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "test-util", "sync", "time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"], optional = true }
getrandom = { version = "0.4", features = ["wasm_js"] }
# bitcoin's `rand-std` feature (secp256k1 -> rand 0.8) and, with `http`,
# jsonwebtoken pull getrandom 0.2, which refuses to build for wasm32 until
# something enables `js`. The cdk crate does that through ring, but this crate
# has to build on its own too.
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
tokio = { workspace = true, default-features = false, features = ["sync"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4"

[dev-dependencies]
ciborium.workspace = true

# criterion pulls rayon, which refuses to build for wasm32, and the benches it
# drives are native-only anyway.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[[bench]]
name = "transaction_id_benchmark"
harness = false

[lints]
workspace = true
