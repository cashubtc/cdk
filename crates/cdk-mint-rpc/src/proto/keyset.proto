syntax = "proto3";

package cdk_mint_keyset_v1;

// Keyset administration for a mint.
service KeysetService {
    // Rotates to the next keyset for the specified currency unit.
    rpc RotateNextKeyset(RotateNextKeysetRequest) returns (RotateNextKeysetResponse) {}

    // Retrieves total issued and redeemed ecash amounts, aggregated by unit and broken down by keyset.
    rpc GetKeysetTotals(GetKeysetTotalsRequest) returns (GetKeysetTotalsResponse) {}
}

message RotateNextKeysetRequest {
    // Currency unit the new keyset signs, e.g. "sat". Known units are
    // matched case-insensitively; custom units are whitespace-trimmed and
    // normalized to lowercase. A unit the mint cannot derive a keyset for
    // fails with gRPC status INVALID_ARGUMENT.
    string unit = 1;
    // Token denominations the keyset can sign, e.g. [1, 2, 4, 8, 16]. If
    // empty, the amounts of the currently active keyset for this unit are
    // reused; rotating a unit that has no active keyset requires a non-empty
    // list.
    repeated uint64 amounts = 2;
    // Input fee charged per input, in parts per thousand. Defaults to 0 when
    // omitted.
    optional uint64 input_fee_ppk = 3;
    // When true (the default), emit a NUT-02 Version01 keyset; when false,
    // a Version00 keyset. Defaults to true if omitted.
    optional bool use_keyset_v2 = 4;
    // Absolute expiry as seconds since the UNIX epoch. Omit for a keyset
    // that never expires.
    optional uint64 final_expiry = 5;
}

// Describes the keyset the mint activated. On failure a gRPC error status is
// returned instead.
message RotateNextKeysetResponse {
    // Hex-encoded ID of the new active keyset.
    string id = 1;
    // Currency unit the keyset signs, normalized to lowercase (e.g. a
    // request of "SAT" returns "sat").
    string unit = 2;
    // Token denominations the new keyset can sign.
    repeated uint64 amounts = 3;
    // Input fee per input, in parts per thousand, applied to this keyset.
    uint64 input_fee_ppk = 4;
}

// Request to retrieve ecash issued and redeemed totals.
message GetKeysetTotalsRequest {
    // Optional currency unit filter (e.g. "sat", "usd").
    // Known units are matched case-insensitively; custom units are whitespace-trimmed and
    // normalized to lowercase. If empty or omitted, totals for all units are returned.
    optional string unit = 1;

    // Optional keyset ID filter (hex string).
    // If empty or omitted, totals for all keysets matching the unit filter are returned.
    optional string keyset_id = 2;
}

// Aggregated ecash totals for a currency unit across all its keysets.
message UnitTotal {
    // Currency unit (e.g. "sat", "usd").
    string unit = 1;
    // Total ecash amount issued for this unit.
    uint64 total_issued = 2;
    // Total ecash amount redeemed for this unit.
    uint64 total_redeemed = 3;
}

// Accounting totals for a specific keyset.
message KeysetTotal {
    // Hex-encoded ID of the keyset.
    string keyset_id = 1;
    // Currency unit for this keyset.
    string unit = 2;
    // Total ecash amount issued with this keyset.
    uint64 total_issued = 3;
    // Total ecash amount redeemed with this keyset.
    uint64 total_redeemed = 4;
}

// Response containing ecash totals by unit and keyset.
message GetKeysetTotalsResponse {
    // Totals aggregated by currency unit.
    repeated UnitTotal unit_totals = 1;

    // Granular totals broken down by keyset ID.
    repeated KeysetTotal keyset_totals = 2;
}

