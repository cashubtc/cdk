[package]
name = "cdk-axum"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage = "https://github.com/cashubtc/cdk"
repository = "https://github.com/cashubtc/cdk.git"
rust-version.workspace = true                            # MSRV
description = "Cashu CDK axum webserver"
readme = "README.md"


[features]
federation = [
    "cdk/federation",
    "cdk-http-client/reqwest",
    "dep:aleph-bft",
    "dep:parity-scale-codec",
    "dep:cdk-frost",
    "dep:cdk-frost-bip32",
    "dep:cdk-bdk",
]
redis = ["dep:redis"]
integration-tests = []
prometheus = ["dep:cdk-prometheus"]
info-page = ["dep:maud"]

[dependencies]
aleph-bft = { workspace = true, optional = true }
anyhow.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["ws"] }
cdk = { workspace = true, features = [
    "mint",
]}
cdk-common.workspace = true
cdk-frost = { workspace = true, optional = true }
cdk-frost-bip32 = { workspace = true, optional = true }
cdk-bdk = { workspace = true, optional = true, features = ["bitcoin-rpc", "esplora"] }
cdk-http-client = { workspace = true, features = ["bitreq"] }
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
futures.workspace = true
cdk-prometheus = { workspace = true , optional = true}
moka = { version = "0.12.10", features = ["future"] }
serde_json.workspace = true
paste.workspace = true
parity-scale-codec = { workspace = true, optional = true }
serde.workspace = true
url.workspace = true
uuid.workspace = true
sha2 = "0.11"
maud = { workspace = true, optional = true }
redis = { version = "0.31.0", default-features = false, features = [
    "tokio-rustls-comp",
    "cluster-async",
    "connection-manager",
], optional = true }

[dev-dependencies]
cdk = { workspace = true, features = ["mint", "wallet"] }
cdk-fake-wallet = { workspace = true }
cdk-sqlite = { workspace = true, features = ["mint", "federation"] }
cdk-signatory = { workspace = true }
bip39 = { workspace = true }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
