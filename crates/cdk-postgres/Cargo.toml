[package]
name = "cdk-postgres"
version.workspace = true
edition.workspace = true
authors = ["CDK Developers"]
description = "PostgreSQL storage backend for CDK"
license.workspace = true
homepage = "https://github.com/cashubtc/cdk"
repository = "https://github.com/cashubtc/cdk.git"
rust-version.workspace = true                            # MSRV

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
default = ["mint", "wallet"]
mint = ["cdk-common/mint", "cdk-sql-common/mint"]
wallet = ["cdk-common/wallet", "cdk-sql-common/wallet"]

[dependencies]
async-trait.workspace = true
cdk-common.workspace = true
cdk-sql-common = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
uuid.workspace = true
tokio-postgres = "0.7.13"
futures-util = "0.3.31"
postgres-native-tls = "0.5.1"
native-tls = "=0.2.18"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
cdk-common = { workspace = true, features = ["test"] }
# Needed at macro-expansion sites of cdk-common's `*_db_test!` macros
paste.workspace = true
cdk-sql-common = { workspace = true, features = ["test"] }

[lints]
workspace = true
