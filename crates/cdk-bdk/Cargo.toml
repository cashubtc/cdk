[package]
name = "cdk-bdk"
version.workspace = true
edition.workspace = true
authors = ["CDK Developers"]
license.workspace = true
homepage = "https://github.com/cashubtc/cdk"
repository = "https://github.com/cashubtc/cdk.git"
rust-version.workspace = true # MSRV
description = "CDK onchain backend with bdk"
readme = "README.md"

[features]
default = ["bitcoin-rpc", "electrum", "esplora"]
bitcoin-rpc = ["dep:bdk_bitcoind_rpc"]
electrum = ["dep:bdk_electrum"]
esplora = ["dep:bdk_esplora"]
# Local TLS relay/directory and Bitcoin Core tests; not needed by the backend.
payjoin-regtest = ["bitcoin-rpc", "esplora", "payjoin/_manual-tls", "dep:payjoin-mailroom", "dep:axum-server", "dep:rcgen", "dep:rustls"]

[dependencies]
async-trait.workspace = true
bdk_wallet = { version = "3.2.0", default-features = false, features = ["std", "rusqlite", "keys-bip39"] }
bdk_bitcoind_rpc = { version = "0.22.0", default-features = false, optional = true }
bdk_electrum = { version = "0.24.0", default-features = false, features = ["use-rustls-ring"], optional = true }
bdk_esplora = { version = "0.22.1", default-features = false, features = ["async-https-rustls", "tokio"], optional = true }
cdk-common = { workspace = true, features = ["mint"] }
futures.workspace = true
tokio.workspace = true 
tokio-util.workspace = true
tracing.workspace = true
thiserror.workspace = true
tokio-stream = { workspace = true, features = ["sync"] }
serde.workspace = true
serde_json.workspace = true
payjoin = { version = "=1.2.0", features = ["io"] }
reqwest.workspace = true
uuid.workspace = true
payjoin-mailroom = { version = "=0.1.3", default-features = false, features = ["connect-bootstrap", "_manual-tls"], optional = true }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"], optional = true }
rcgen = { version = "0.14", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }

[dev-dependencies]
cdk-sqlite = { workspace = true }
tempfile = "3"

[lints]
workspace = true
