[package]
name = "cdk-bdk"
version.workspace = true
edition.workspace = true
authors = ["CDK Developers"]
license.workspace = true
homepage = "https://github.com/cashubtc/cdk"
repository = "https://github.com/cashubtc/cdk.git"
rust-version.workspace = true # MSRV
description = "CDK onchain backend with bdk"
readme = "README.md"

[features]
default = ["bitcoin-rpc", "electrum", "esplora"]
bitcoin-rpc = ["dep:bdk_bitcoind_rpc", "cdk-bitcoin-wallet/bitcoin-rpc"]
esplora = ["dep:bdk_esplora", "cdk-bitcoin-wallet/esplora"]
electrum = ["cdk-bitcoin-wallet/electrum"]

[dependencies]
async-trait.workspace = true
bdk_wallet = { version = "3.2.0", default-features = false, features = ["std", "rusqlite", "keys-bip39"] }
bdk_bitcoind_rpc = { version = "0.22.0", default-features = false, optional = true }
bdk_electrum = { version = "0.24.0", default-features = false, features = ["use-rustls-ring"], optional = true }
bdk_esplora = { version = "0.22.1", default-features = false, features = ["async-https-rustls", "tokio"], optional = true }
cdk-common = { workspace = true, features = ["mint"] }
cdk-bitcoin-wallet = { workspace = true, features = ["payment-adapter"] }
futures.workspace = true
tokio.workspace = true 
tokio-util.workspace = true
tracing.workspace = true
thiserror.workspace = true
tokio-stream = { workspace = true, features = ["sync"] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

[dev-dependencies]
cdk-sqlite = { workspace = true }
tempfile = "3"
