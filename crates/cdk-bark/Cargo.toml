[package]
name = "cdk-bark"
version.workspace = true
edition.workspace = true
authors = ["CDK Developers"]
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Federated Bark BOLT11 backend for CDK"

[features]
default = []
federation-bark = [
    "dep:aes-gcm",
    "dep:anyhow",
    "dep:async-trait",
    "dep:bark",
    "dep:bitcoin",
    "dep:cdk-common",
    "dep:cdk-bitcoin-wallet",
    "dep:cdk-federation-bark",
    "dep:cdk-frost-bark",
    "dep:cdk-frost-bip32",
    "dep:cdk-frost",
    "dep:futures",
    "dep:redb",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
    "dep:thiserror",
    "dep:tokio",
    "dep:tracing",
    "dep:zeroize",
]
# This feature only relaxes trusted-dealer admission for local/regtest tests.
federation-test-utils = ["federation-bark"]

[dependencies]
aes-gcm = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
# Pin the reviewed federation custody and Lightning APIs.
bark = { package = "bark-wallet", git = "https://github.com/callebtc/bark", rev = "8d1eda643dd11e9eb600ec44e36622c8f77b6322", default-features = false, features = ["bitcoind-rpc", "native", "sqlite", "tls-webpki-roots"], optional = true }
bitcoin = { workspace = true, optional = true }
cdk-common = { workspace = true, features = ["federation", "mint"], optional = true }
cdk-bitcoin-wallet = { workspace = true, features = ["bitcoin-rpc", "esplora"], optional = true }
cdk-federation-bark = { workspace = true, optional = true }
cdk-frost-bark = { workspace = true, optional = true }
cdk-frost-bip32 = { workspace = true, optional = true }
cdk-frost = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync"], optional = true }
tracing = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
redb = { version = "3.1.0", optional = true }

[dev-dependencies]
cashu.workspace = true
rand_chacha = "0.3"
tempfile = "3"

[lints]
workspace = true
