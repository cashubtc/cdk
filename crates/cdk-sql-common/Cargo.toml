[package]
name = "cdk-sql-common"
version.workspace = true
edition.workspace = true
authors = ["CDK Developers"]
description = "Generic SQL storage backend for CDK"
license.workspace = true
homepage = "https://github.com/cashubtc/cdk"
repository = "https://github.com/cashubtc/cdk.git"
rust-version.workspace = true                            # MSRV
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
default = ["mint", "wallet"]
mint = ["cdk-common/mint"]
wallet = ["cdk-common/wallet"]
prometheus = ["cdk-prometheus"]
# Exposes the shared bus test suite (see mint::bus_test + the `sql_bus_test!`
# macro) so backend crates can run it. Enable only in dev-dependencies.
test = ["mint", "cdk-common/test"]
[dependencies]
async-trait.workspace = true
cdk-common.workspace = true
cdk-prometheus = { workspace = true, optional = true }
bitcoin.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
lightning-invoice.workspace = true
once_cell.workspace = true
uuid.workspace = true

[lints]
workspace = true
