[package]
name = "cdk-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "FFI bindings for cdk wallet"
homepage = "https://github.com/cashubtc/cdk"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
name = "cdk_ffi"

[dependencies]
async-trait = { workspace = true }
bip39 = { workspace = true }
cdk = { workspace = true, default-features = false, features = ["wallet", "nostr"] }
cdk-http-client = { workspace = true, features = ["bitreq"] }
cdk-sqlite = { workspace = true }
cdk-postgres = { workspace = true, optional = true }
cdk-supabase = { workspace = true, optional = true, features = ["wallet"] }
cdk-nostr = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
cdk-sql-common = { workspace = true }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "rt-multi-thread"] }
uniffi = { workspace = true, features = ["cli", "tokio"] }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
cdk-common.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
log = "0.4"


[features]
default = ["npubcash", "nwc", "bip353"]
bip353 = ["cdk/bip353"]
# Enable Postgres-backed wallet database support in FFI
postgres = ["cdk-postgres"]
# Enable Supabase-backed wallet database support in FFI
supabase = ["cdk-supabase"]
# Nostr base bindings: keys, NIP-44 encryption and the NIP-17 inbox listener
nostr = ["dep:cdk-nostr"]
# Enable NpubCash client bindings
npubcash = ["cdk/npubcash", "nostr", "cdk-nostr/npubcash"]
# Enable Nostr Wallet Connect (NIP-47) wallet service bindings
nwc = ["cdk/nwc", "nostr", "cdk-nostr/nwc", "dep:tokio-util"]

[dev-dependencies]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[[example]]
name = "mobile_nostr_identity"
required-features = ["npubcash"]

[lints]
workspace = true
