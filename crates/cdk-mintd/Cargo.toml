[package]
name = "cdk-mintd"
version.workspace = true
edition.workspace = true
authors = ["CDK Developers"]
license.workspace = true
homepage = "https://github.com/cashubtc/cdk"
repository = "https://github.com/cashubtc/cdk.git"
description = "CDK mint binary"
rust-version.workspace = true
readme = "README.md"

[features]
default = ["management-rpc", "cln", "lnd", "fakewallet", "grpc-processor", "sqlite", "info-page", "bdk"]
# Database features - at least one must be enabled
sqlite = ["dep:cdk-sqlite"]
postgres = ["dep:cdk-postgres"]
# Ensure at least one payment backend is enabled
management-rpc = ["cdk-mint-rpc"]
cln = ["dep:cdk-cln"]
lnd = ["dep:cdk-lnd"]
fakewallet = ["dep:cdk-fake-wallet"]
ldk-node = ["dep:cdk-ldk-node"]
bdk = ["dep:cdk-bdk", "cdk-bdk/bitcoin-rpc", "cdk-bdk/electrum", "cdk-bdk/esplora"]
grpc-processor = ["dep:cdk-payment-processor", "cdk-signatory/grpc"]
sqlcipher = ["sqlite", "cdk-sqlite/sqlcipher"]
redis = ["cdk-axum/redis"]
prometheus = ["cdk/prometheus", "dep:cdk-prometheus", "cdk-sqlite?/prometheus", "cdk-axum/prometheus"]
info-page = ["cdk-axum/info-page"]
iroh = ["cdk/iroh", "cdk-axum/iroh", "dep:cdk-iroh"]
federation = ["cdk/federation", "cdk/wallet", "cdk-common/federation", "cdk-axum/federation", "cdk-sqlite?/federation", "cdk-sqlite?/wallet", "cdk-postgres?/federation"]
# Federated on-chain payments are independent from the base consensus runtime.
federation-bdk = ["federation", "bdk", "cdk-axum/federation-bdk"]
# Federated Bark is deliberately separate so ordinary federation builds do not
# resolve or compile the Bark dependency graph.
federation-bark = ["federation", "dep:cdk-bark", "dep:cdk-federation-bark", "cdk/federation-bark", "cdk-bark/federation-bark", "cdk-axum/federation-bark", "cdk-sqlite?/federation-bark", "cdk-postgres?/federation-bark"]
# Local/regtest-only trusted-dealer setup and runtime admission.
federation-test-utils = ["cdk-common/test", "federation", "fakewallet", "cdk-bark?/federation-test-utils"]

[dependencies]
futures.workspace = true
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
cdk = { workspace = true, features = [
    "mint",
] }
cdk-http-client = { workspace = true, features = ["bitreq"] }
cdk-iroh = { workspace = true, optional = true }
cdk-sqlite = { workspace = true, features = [
    "mint"
], optional = true  }
cdk-common = {workspace = true, features = ["prometheus"]}
cdk-postgres = { workspace = true, features = ["mint"], optional = true}
cdk-cln = { workspace = true, optional = true }
cdk-lnd = { workspace = true, optional = true }
cdk-ldk-node = { workspace = true, optional = true }
cdk-fake-wallet = { workspace = true, optional = true }
cdk-bdk = { workspace = true, optional = true }
cdk-bark = { workspace = true, optional = true }
cdk-federation-bark = { workspace = true, optional = true }
cdk-axum.workspace = true
cdk-signatory.workspace = true
cdk-mint-rpc = { workspace = true, optional = true }
cdk-payment-processor = { workspace = true, optional = true }
config.workspace = true
cdk-prometheus = { workspace = true, optional = true , features = ["system-metrics"]}
clap.workspace = true
bitcoin.workspace = true
tokio = { workspace = true, default-features = false, features = ["signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
serde.workspace = true
serde_ignored.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml = { workspace = true, features = ["parse"] }
bip39.workspace = true
url.workspace = true
zeroize.workspace = true
tower-http = { workspace = true, features = ["compression-full", "decompression-full"] }
tower.workspace = true
home.workspace = true

[lints]
workspace = true

[build-dependencies]

[dev-dependencies]
cdk-common = { workspace = true, features = ["test"] }
cdk-frost.workspace = true
tempfile = "3"
