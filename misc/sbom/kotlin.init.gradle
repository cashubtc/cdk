// Kept separate from the published project: ordinary builds do not load the plugin.
import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.result.UnresolvedDependencyResult

initscript {
    repositories { maven { url 'https://plugins.gradle.org/m2/' } }
    dependencies { classpath 'org.cyclonedx:cyclonedx-gradle-plugin:2.4.1' }
}

def settingsClasspath
gradle.settingsEvaluated { settings ->
    settingsClasspath = settings.extensions.extraProperties.get('cdkSbomSettingsClasspath')
}

allprojects {
    if (name == 'cdk-android' || name == 'cdk-jvm') {
        apply plugin: org.cyclonedx.gradle.CycloneDxPlugin
        tasks.named('cyclonedxBom') {
            includeConfigs = project.name == 'cdk-android' ?
                ['releaseRuntimeClasspath', 'releaseCompileClasspath'] : ['runtimeClasspath', 'compileClasspath']
            schemaVersion = '1.6'
            projectType = 'library'
            includeLicenseText = false
            includeBuildSystem = false
            jsonOutput = file("${buildDir}/reports/sbom/bom.json")
        }
        tasks.register('cdkSbomEvidence') {
            dependsOn tasks.named('cyclonedxBom')
            doLast {
                def configurationsToRecord = project.name == 'cdk-android' ?
                    ['releaseRuntimeClasspath', 'releaseCompileClasspath'] : ['runtimeClasspath', 'compileClasspath']
                def graphs = []
                def record = { configuration, role, owner ->
                    def resolution = configuration.incoming.resolutionResult
                    resolution.allDependencies.each { dependency ->
                        if (dependency instanceof UnresolvedDependencyResult) {
                            throw new GradleException("Unresolved SBOM dependency: ${dependency.attempted}", dependency.failure)
                        }
                    }
                    def modules = resolution.allComponents.findAll {
                        it.id instanceof ModuleComponentIdentifier
                    }.collect { component ->
                        [group: component.id.group, name: component.id.module, version: component.id.version,
                         dependencies: component.dependencies.findAll { it.selected.id instanceof ModuleComponentIdentifier }
                            .collect { "${it.selected.id.group}:${it.selected.id.module}:${it.selected.id.version}" }.sort()]
                    }
                    def artifacts = configuration.incoming.artifacts.artifacts.collect { artifact ->
                        def id = artifact.id.componentIdentifier
                        if (!(id instanceof ModuleComponentIdentifier)) {
                            throw new GradleException("Non-module SBOM artifact requires explicit provenance: ${id}")
                        }
                        [group: id.group, name: id.module, version: id.version, file: artifact.file.absolutePath]
                    }
                    graphs.add([configuration: "${owner}:${configuration.name}", role: role,
                                modules: modules, artifacts: artifacts])
                }
                configurationsToRecord.each { record(project.configurations.getByName(it), 'product', project.path) }
                // Plugin/buildscript dependencies are a separate scannable inventory.
                [rootProject, project].unique().each { owner ->
                    def classpath = owner.buildscript.configurations.findByName('classpath')
                    if (classpath != null && classpath.canBeResolved) record(classpath, 'build', owner.path)
                }
                record(settingsClasspath, 'build', ':settings')
                def destination = file("${buildDir}/reports/sbom/resolved.json")
                destination.parentFile.mkdirs()
                destination.text = JsonOutput.prettyPrint(JsonOutput.toJson([graphs: graphs]))
            }
        }
    }
}
