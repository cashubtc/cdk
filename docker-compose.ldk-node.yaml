# Before starting, export distinct stable BIP39 values for
# CDK_MINTD_MNEMONIC and CDK_MINTD_LDK_NODE_MNEMONIC.
services:
  # CDK Mint service with LDK Node backend

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./misc/provisioning/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--enable-feature=otlp-write-receiver'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - cdk

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3011:3000"
    volumes:
      - ./misc/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./misc/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    environment:
      - GF_DASHBOARDS_JSON_ENABLED=true
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PROVISIONING_PATHS=/etc/grafana/provisioning
    networks:
      - cdk

  mintd-ldk-node:
    # Use the ldk-node tagged image from the same repository
    image: cashubtc/mintd:ldk-node-amd64
    # Alternatively, build locally:
    # build:
    #   context: .
    #   dockerfile: Dockerfile.ldk-node
    container_name: mint-ldk-node
    ports:
      - "8085:8085"
      - "127.0.0.1:8091:8091" # LDK admin dashboard; host-local only because it has no authentication
    environment:
      CDK_MINTD_DATABASE: sqlite
      CDK_MINTD_MNEMONIC: "${CDK_MINTD_MNEMONIC:?Set CDK_MINTD_MNEMONIC to a stable BIP39 mnemonic}"
      CDK_MINTD_LDK_NODE_MNEMONIC: "${CDK_MINTD_LDK_NODE_MNEMONIC:?Set CDK_MINTD_LDK_NODE_MNEMONIC to a stable BIP39 mnemonic}"

    volumes:
      - ./misc/docker-configs/ldk-node-sqlite.toml:/etc/cdk-mintd/config.toml:ro
      - ./misc/docker-mintd-entrypoint.sh:/usr/local/bin/docker-mintd-entrypoint.sh:ro
      - ldk_node_data:/var/lib/cdk-mintd
    command: ["/bin/sh", "/usr/local/bin/docker-mintd-entrypoint.sh"]
    depends_on:
      - prometheus
      - grafana
    networks:
      - cdk
    # Uncomment when using PostgreSQL:
    # depends_on:
    #   - postgres

  # PostgreSQL database service
  # Enable with: docker-compose --profile postgres up
  postgres:
    image: postgres:16-alpine
    container_name: mint_postgres
    restart: unless-stopped
    profiles:
      - postgres
    environment:
      - POSTGRES_USER=cdk_user
      - POSTGRES_PASSWORD=cdk_password
      - POSTGRES_DB=cdk_mint
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdk_user -d cdk_mint"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cdk

volumes:
  postgres_data:
    driver: local
  ldk_node_data:
    driver: local

networks:
  cdk:
    driver: bridge
